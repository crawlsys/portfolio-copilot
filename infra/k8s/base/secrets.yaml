# tracker-secrets TEMPLATE — never commit real values.
#
# Real API keys were committed here 2026-06-22..2026-07-10 while the repo was
# public (removed 2026-07-10; keys rotated — see CHANGELOG). Populate a copy
# of this file out-of-band, or better, migrate to Bitwarden Secrets Manager
# via the secrets-store CSI driver like the rest of the homelab.
#
# Apply pattern:
#   cp infra/k8s/base/secrets.yaml /somewhere-untracked/secrets-real.yaml
#   $EDITOR /somewhere-untracked/secrets-real.yaml   # fill in values
#   kubectl apply -f /somewhere-untracked/secrets-real.yaml
apiVersion: v1
kind: Secret
metadata:
  name: tracker-secrets
  namespace: tracker
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://tracker:CHANGE_ME@tracker-postgres:5432/tracker
  POSTGRES_PASSWORD: CHANGE_ME
  BROKER_MODE: fake # fake | schwab
  ALLOW_LIVE_TRADING: "false"
  # Schwab OAuth (broker) — token file lives in Secret/tracker-schwab-token
  SCHWAB_CLIENT_ID: ""
  SCHWAB_CLIENT_SECRET: ""
  SCHWAB_REDIRECT_URI: https://127.0.0.1:8080/callback
  SELF_DIRECTED_ACCOUNT_ID: ""
  # Market + congressional data
  MASSIVE_API_KEY: ""
  QUIVER_API_KEY: ""
  # LLM (briefing + advisor council via litellm gateway)
  LLM_PROVIDER: litellm
  LLM_API_KEY: ""
  LLM_MODEL: local-strong
  LITELLM_BASE_URL: ""
  # Digest (OpenRouter frontier)
  OPENROUTER_API_KEY: ""
  DIGEST_URL: ""
  # Notifications
  PUSH_PROVIDER: pushover
  PUSHOVER_API_TOKEN: ""
  PUSHOVER_USER_KEY: ""
