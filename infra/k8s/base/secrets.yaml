apiVersion: v1
kind: Secret
metadata:
  name: tracker-secrets
  namespace: tracker
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://tracker:***REMOVED***@tracker-postgres:5432/tracker
  BROKER_MODE: fake
  ALLOW_LIVE_TRADING: "false"
  MASSIVE_API_KEY: ***REMOVED***
  QUIVER_API_KEY: ***REMOVED***
  LLM_PROVIDER: litellm
  LLM_API_KEY: ***REMOVED***
  LLM_MODEL: local-fast
  LITELLM_BASE_URL: http://litellm:4000
  PUSH_PROVIDER: pushover
  PUSHOVER_API_TOKEN: ***REMOVED***
  PUSHOVER_USER_KEY: ***REMOVED***
  POSTGRES_PASSWORD: ***REMOVED***
