# Public Schwab OAuth callback service (webhook.example.com).
#
# Least privilege: the pod runs as `tracker-schwab-writer`, whose Role grants
# get/patch on the SINGLE Secret `tracker-schwab-token` and nothing else. Even
# though this service is public, a compromise cannot read or write any other
# secret. The Schwab client id/secret it needs for the token exchange arrive as
# env via secretKeyRef (kubelet-injected — needs no RBAC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracker-schwab-writer
  namespace: tracker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tracker-schwab-writer
  namespace: tracker
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tracker-schwab-token"] # scoped to exactly one Secret
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tracker-schwab-writer
  namespace: tracker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tracker-schwab-writer
subjects:
  - kind: ServiceAccount
    name: tracker-schwab-writer
    namespace: tracker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-webhook
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracker
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracker
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: tracker-schwab-writer
      containers:
        - name: webhook
          image: harbor.example.com/tracker/tracker-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "apps.webhook"]
          env:
            - name: WEBHOOK_PORT
              value: "8090"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Only the specific keys this service needs — NOT envFrom the whole
            # secret. It never sees any other tracker secret.
            - name: SCHWAB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tracker-secrets
                  key: SCHWAB_CLIENT_ID
            - name: SCHWAB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracker-secrets
                  key: SCHWAB_CLIENT_SECRET
            - name: SCHWAB_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: tracker-secrets
                  key: SCHWAB_REDIRECT_URI
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tracker-webhook
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: webhook
  ports:
    - name: http
      port: 8090
      targetPort: http
