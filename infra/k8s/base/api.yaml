apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-api
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracker
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracker
        app.kubernetes.io/component: api
    spec:
      volumes:
        - name: holdings
          configMap:
            name: tracker-holdings
        - name: schwab-token
          secret:
            secretName: tracker-schwab-token
        # Mounting the SPC is what makes the CSI driver create/refresh the
        # synced Secrets (tracker-secrets, tracker-schwab-token) from Bitwarden.
        # tracker-api + tracker-worker are always-on, so they keep those Secrets
        # populated for the CronJobs (which consume them via envFrom).
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            nodePublishSecretRef:
              name: bws-token
            volumeAttributes:
              secretProviderClass: tracker-secrets
      containers:
        - name: api
          image: harbor.example.com/tracker/tracker-backend:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: holdings
              mountPath: /app/data/holdings.json
              subPath: holdings.json
              readOnly: true
            # The digest chat (/digest/chat) reads the self-directed account
            # ledger live in the API pod, so it must be mounted here too — not
            # just in the digest CronJob.
            - name: holdings
              mountPath: /app/data/holdings-individual.json
              subPath: holdings-individual.json
              readOnly: true
            - name: schwab-token
              mountPath: /etc/schwab
              readOnly: true
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          command:
            - uvicorn
            - apps.api.app:create_app
            - --factory
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          envFrom:
            - secretRef:
                name: tracker-secrets
          ports:
            - name: http
              containerPort: 8001
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tracker-api
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8001
      targetPort: http
