# Secrets come from Bitwarden Secrets Manager via the secrets-store CSI driver
# (provider: bitwarden) — NOT from a committed Secret manifest. This file lists
# only BWS secret UUIDs (references), never any secret value.
#
# Prerequisites (created out-of-band, NOT in git):
#   - Secret `bws-token` in namespace `tracker` with key `access_token`
#     (a Bitwarden Secrets Manager machine-account token scoped to the project
#     holding these UUIDs). Referenced below via nodePublishSecretRef.
#
# How it populates: the synced k8s Secrets (`tracker-secrets`,
# `tracker-schwab-token`) are created and kept up to date only while a pod
# MOUNTS this SecretProviderClass as a CSI volume. tracker-api and
# tracker-worker (always-on) hold that mount; every other workload consumes the
# synced Secrets via envFrom/volume. See api.yaml / worker.yaml / mcp.yaml.
#
# To rotate a value: edit it in Bitwarden Secrets Manager (`bws secret edit`),
# then restart a mounting pod (or wait for the CSI rotation poll). Never patch
# the synced Secret directly — CSI overwrites it from BWS.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tracker-secrets
  namespace: tracker
  labels:
    app.kubernetes.io/name: tracker
spec:
  provider: bitwarden
  parameters:
    objects: |
      - id: 85dd7fb2-8aef-4196-bf43-b47301186193
        path: ALLOW_LIVE_TRADING
      - id: c1f418dd-e6f0-46b0-9c65-b473011861bc
        path: BROKER_MODE
      - id: ce0f561f-51ef-41a8-9090-b473011861df
        path: DATABASE_URL
      - id: 05f7596d-2f37-4266-bcbe-b47301186202
        path: DIGEST_URL
      - id: f4df21d0-a468-43f0-9531-b4730118622c
        path: LITELLM_BASE_URL
      - id: 21cf9a5c-6ba8-49b8-b231-b47301187b7f
        path: LLM_API_KEY
      - id: 605e9de2-b919-4b5a-b456-b47301187dff
        path: LLM_MODEL
      - id: 414257a6-3885-40ab-9379-b47301188085
        path: LLM_PROVIDER
      - id: 4b194534-458d-4c10-9340-b47301188306
        path: MASSIVE_API_KEY
      - id: 884d46a7-391a-4703-a67c-b47301188582
        path: OPENROUTER_API_KEY
      - id: 046574ec-30da-482a-b095-b47301188801
        path: POSTGRES_PASSWORD
      - id: 85d6eda6-3873-42bc-9876-b47301188a82
        path: PUSHOVER_API_TOKEN
      - id: 492ddede-5427-49fa-8a6d-b47301188cff
        path: PUSHOVER_USER_KEY
      - id: 95247371-05cb-4036-89ea-b47301188f80
        path: PUSH_PROVIDER
      - id: eaf9fb4f-ac12-4aa6-9db2-b47301189206
        path: QUIVER_API_KEY
      - id: c1ea56ec-2c4e-4a6e-b251-b47a016e1fc0
        path: SCHWAB_CLIENT_ID
      - id: 23644cba-12ca-41b9-b6d6-b47a016e230a
        path: SCHWAB_CLIENT_SECRET
      - id: 16608c82-45eb-4844-84ec-b47a016e25f5
        path: SCHWAB_REDIRECT_URI
      - id: 96bde1e4-7c01-4d41-8448-b47a016dbb10
        path: SELF_DIRECTED_ACCOUNT_ID
      # Schwab OAuth token blob (access + refresh + metadata). Produced by
      # scripts/schwab_login.py, which pushes it to this BWS secret on re-auth.
      - id: e2eaf809-1477-4131-8486-b48400102584
        path: token.json
  # Two synced Secrets from one SPC: the env bundle (tracker-secrets) and the
  # Schwab token file (tracker-schwab-token, mounted at /etc/schwab/token.json).
  secretObjects:
    - secretName: tracker-secrets
      type: Opaque
      data:
        - {objectName: ALLOW_LIVE_TRADING, key: ALLOW_LIVE_TRADING}
        - {objectName: BROKER_MODE, key: BROKER_MODE}
        - {objectName: DATABASE_URL, key: DATABASE_URL}
        - {objectName: DIGEST_URL, key: DIGEST_URL}
        - {objectName: LITELLM_BASE_URL, key: LITELLM_BASE_URL}
        - {objectName: LLM_API_KEY, key: LLM_API_KEY}
        - {objectName: LLM_MODEL, key: LLM_MODEL}
        - {objectName: LLM_PROVIDER, key: LLM_PROVIDER}
        - {objectName: MASSIVE_API_KEY, key: MASSIVE_API_KEY}
        - {objectName: OPENROUTER_API_KEY, key: OPENROUTER_API_KEY}
        - {objectName: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD}
        - {objectName: PUSHOVER_API_TOKEN, key: PUSHOVER_API_TOKEN}
        - {objectName: PUSHOVER_USER_KEY, key: PUSHOVER_USER_KEY}
        - {objectName: PUSH_PROVIDER, key: PUSH_PROVIDER}
        - {objectName: QUIVER_API_KEY, key: QUIVER_API_KEY}
        - {objectName: SCHWAB_CLIENT_ID, key: SCHWAB_CLIENT_ID}
        - {objectName: SCHWAB_CLIENT_SECRET, key: SCHWAB_CLIENT_SECRET}
        - {objectName: SCHWAB_REDIRECT_URI, key: SCHWAB_REDIRECT_URI}
        - {objectName: SELF_DIRECTED_ACCOUNT_ID, key: SELF_DIRECTED_ACCOUNT_ID}
    - secretName: tracker-schwab-token
      type: Opaque
      data:
        - {objectName: token.json, key: token.json}
